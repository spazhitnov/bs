@if (formGroup) {
<div [formGroup]="formGroup">
  <span class="p-float-label">
    <p-multiSelect
      requiredField
      [options]="authors()"
      formControlName="authors"
      optionLabel="name"
      display="chip"
    ></p-multiSelect>
    <label for="authors">Авторы</label>
  </span>
</div>
}
