<p-card
  isnewcourse
  [course]="course"
  [ngClass]="course.topRated ? 'top-rated' : ''"
>
  <div class="flex-column p-4">
    <div class="flex justify-content-between align-items-center mb-3">
      <div class="flex gap-3">
        <span class="title">{{ course.title | uppercase }}</span>
        <svg
          *ngIf="course.topRated"
          width="20"
          height="18"
          viewBox="0 0 20 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M19.12 6.87999C19.0781 6.74713 18.9996 6.62878 18.8935 6.53856C18.7873 6.44834 18.6579 6.38991 18.52 6.36999L13.1 5.57999L10.67 0.669993C10.6008 0.553966 10.5027 0.457888 10.3853 0.391167C10.2678 0.324446 10.1351 0.289368 10 0.289368C9.86493 0.289368 9.73217 0.324446 9.61472 0.391167C9.49727 0.457888 9.39917 0.553966 9.33 0.669993L6.9 5.57999L1.48 6.36999C1.34213 6.38991 1.21268 6.44834 1.10653 6.53856C1.00039 6.62878 0.921871 6.74713 0.880004 6.87999C0.835308 7.01237 0.828477 7.15459 0.860281 7.29064C0.892084 7.42669 0.961258 7.55115 1.06 7.64999L5 11.47L4.07 16.87C4.04643 17.009 4.06201 17.1519 4.11499 17.2826C4.16797 17.4133 4.25627 17.5266 4.37 17.61C4.48392 17.6912 4.61827 17.7389 4.75787 17.7477C4.89747 17.7565 5.03676 17.7262 5.16 17.66L10 15.11L14.85 17.66C14.9573 17.7189 15.0776 17.7498 15.2 17.75C15.3573 17.7482 15.5106 17.6994 15.64 17.61C15.7537 17.5266 15.842 17.4133 15.895 17.2826C15.948 17.1519 15.9636 17.009 15.94 16.87L15 11.47L18.93 7.64999C19.0305 7.55223 19.1015 7.42826 19.1351 7.29216C19.1687 7.15606 19.1635 7.01327 19.12 6.87999Z"
            fill="#F59E0B"
          />
        </svg>
      </div>
      <div class="flex gap-3">
        <div class="flex gap-2">
          <i
            class="pi pi-clock"
            style="font-size: 0.875rem; color: #64748b"
          ></i>
          <span class="text-sm">{{ course.duration | duration }}</span>
        </div>
        <div class="flex gap-2">
          <i
            class="pi pi-calendar"
            style="font-size: 0.875rem; color: #64748b"
          ></i>
          <span class="text-sm">
            {{ (course.creationDate | date : "dd MMMM yyyy") + " года" }}
          </span>
        </div>
      </div>
    </div>
    <div class="flex justify-content-between align-items-center">
      <span>{{ course.description }}</span>
      <div class="flex">
        <p-button
          icon="pi pi-pencil"
          styleClass="p-button-sm p-button-text"
          (click)="change.emit(course)"
        ></p-button>
        <p-button
          icon="pi pi-trash"
          styleClass="p-button-sm p-button-text p-button-danger"
          (click)="delete.emit({event: $event, id: course.id})"
        ></p-button>
      </div>
    </div>
  </div>
</p-card>
