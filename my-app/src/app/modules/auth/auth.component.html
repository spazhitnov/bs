<div class="auth-container">
    <p-card>
      <div class="grid fluid auth-card">
        <div class="col-12">
          <h1>Вход</h1>
        </div>
        <div class="col-12">
          <span class="p-float-label">
            <input inputId="email" type="text" [(ngModel)]="email" pInputText />
            <label for="email">Логин</label>
          </span>
        </div>
        <div class="col-12">
          <span class="p-float-label">
            <p-password
              inputId="password"
              [(ngModel)]="password"
              [toggleMask]="true"
              [feedback]="false"
              appendTo="body"
            />
            <label for="password">Пароль</label>
          </span>
        </div>
        <div class="col-12 flex justify-content-between align-items-center">
          <a href="" style="color: #3b82f6">Забыли пароль?</a>
          <p-button label="Войти" (click)="login.emit({email, password})"></p-button>
        </div>
      </div>
    </p-card>
  </div>
